<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>업무 챗봇 검색기</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        #chatBox { height: 400px; border: 1px solid #ddd; border-radius: 8px; overflow-y: auto; padding: 15px; margin-bottom: 15px; background: #f9f9f9; }
        .message { margin-bottom: 10px; padding: 10px; border-radius: 8px; }
        .user-msg { background: #e0f7fa; text-align: right; }
        .ai-msg { background: #fff; border: 1px solid #eee; white-space: pre-wrap; }
        input[type="text"] { width: 75%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 20%; padding: 10px; background: #4f46e5; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>💬 사내 카톡 기록 검색 챗봇</h2>
    <div id="chatBox"></div>
    
    <div>
        <input type="text" id="userInput" placeholder="질문을 입력하세요 (예: 솥밥 언제 처음 제공했지?)">
        <button onclick="sendMessage()">질문하기</button>
    </div>

    <script>
        // 2단계에서 복사한 GAS 웹 앱 URL을 아래에 붙여넣으세요.
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyHDvPI0D5-z81r-AnVw1YYbBiEU5zUvORmtTeqrIsgZPOWAV6TJjR0BtFDJiWCPSyV/exec";

        async function sendMessage() {
            const inputField = document.getElementById("userInput");
            const chatBox = document.getElementById("chatBox");
            const query = inputField.value;

            if (!query) return;

            // 사용자 질문 화면에 표시
            chatBox.innerHTML += `<div class="message user-msg">${query}</div>`;
            inputField.value = "";
            chatBox.innerHTML += `<div id="loading" class="message"><i>데이터를 검색하고 분석 중입니다...</i></div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // GAS로 데이터 전송 (CORS 이슈 방지를 위해 text/plain 사용)
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({query: query}),
                    headers: { "Content-Type": "text/plain;charset=utf-8" }
                });
                
                const data = await response.json();
                document.getElementById("loading").remove();
                
                // AI 답변 화면에 표시
                if(data.answer) {
                    chatBox.innerHTML += `<div class="message ai-msg">🤖 <b>AI 답변:</b><br>${data.answer}</div>`;
                } else {
                    chatBox.innerHTML += `<div class="message ai-msg" style="color:red;">❌ 오류: ${data.error}</div>`;
                }
                chatBox.scrollTop = chatBox.scrollHeight;

            } catch (err) {
                document.getElementById("loading").remove();
                chatBox.innerHTML += `<div class="message ai-msg" style="color:red;">❌ 서버 통신 오류가 발생했습니다.</div>`;
            }
        }
    </script>
</body>
</html>
